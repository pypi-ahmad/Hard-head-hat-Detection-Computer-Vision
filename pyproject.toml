[project]
name = "ppe-detection"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=17.1.0",
    "cv2-enumerate-cameras>=1.4.0",
    "gdown>=6.4.2",
    "kaggle>=2.2.4",
    "lap>=0.5.12",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "streamlit-webrtc>=0.79.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.184",
    "yt-dlp>=2026.10.21",
    "yt-dlp-ejs>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["datasets", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
